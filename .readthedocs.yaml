#
# ReadTheDocs configuration copied from .build-commons/docs
#
version: 2

submodules:
  recursive: false
  include: 
    - .build-commons

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    pre_build:
      - bash .build-commons/docs/pre_build.sh

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: .build-commons/docs/requirements.txt
