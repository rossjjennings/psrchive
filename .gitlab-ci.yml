# PSRCHIVE GitLab CI/CD Configuration

include:
  - project: 'pulsar-astronomy/build-commons'
    file: 'gitlab/builder.yml'

workflow:
  rules:
    # Prevent duplicate branch pipelines
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - !reference [.builder-rules]

stages:
  - prepare
  - build
  - test
  - analysis
  - release

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GITLAB_CI_TAG: k8srunner-psi-low

# ============================================================
# Shared-runner CI
# ============================================================

.shared_rules:
  rules:
    - when: on_success

# full build with all optional dependencies installed
build-standard:
  stage: build
  extends: .shared_rules
  needs:
    - job: builder-image
      optional: true
    - job: validate-tag-version
      optional: true
  script: |
    ./bootstrap
    mkdir -p build
    cd build
    ../configure --enable-shared --prefix=/pulsar
    set -o pipefail
    # bear generates the compilation database used by clang-tidy
    bear -- make -j4 2>&1 | tee make.log
    make install
    python -c "import psrchive; print('Python bindings OK')"
  artifacts:
    when: always
    paths:
      - .
    expire_in: 1 hour

# barebones build with no optional dependencies installed
barebones:
  stage: build
  extends: .shared_rules
  image: ubuntu:24.04
  needs:
    - job: validate-tag-version
      optional: true
  before_script:
    - .build-commons/docker/install-deps.sh
  script: |
    ./bootstrap
    ./configure
    echo "Running make with output redirected to make.log"
    make -j4 > make.log 2>&1

test:
  stage: test
  extends: .shared_rules
  needs:
    - job: build-standard
      optional: false
  script:
    - cd build
    - make -j4 check
  artifacts:
    when: always
    paths:
      - "build/test-suite.log"
    expire_in: 1 week

# full build and distcheck with all optional dependencies installed
distcheck:
  stage: test
  extends: .shared_rules
  needs:
    - job: build-standard
      optional: false
  script: |
    cd build
    echo "Running make distcheck with output redirected to distcheck.log"
    make -j4 distcheck > distcheck.log 2>&1
    cd ..
    ls -d -- build/*.tar.gz
  artifacts:
    paths:
      - build/*.tar.gz
      - build/distcheck.log
    expire_in: 1 day

cppcheck:
  stage: analysis
  extends: .shared_rules
  script:
    - cppcheck --enable=warning,performance,portability
        --suppress=missingIncludeSystem
        --xml --xml-version=2
        -I Util -I Base -I More
        Util Base More 2> cppcheck-report.xml
    - cppcheck --enable=warning,performance,portability
        --suppress=missingIncludeSystem
        Util Base More
  artifacts:
    when: always
    paths:
      - cppcheck-report.xml
    expire_in: 1 week

# Allow clang-tidy to fail (for now)
clang-tidy:
  stage: analysis
  allow_failure: true
  extends: .shared_rules
  needs:
    - job: build-standard
      optional: false
  rules:
    # If we are on the main/default branch, run a full scan
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        TIDY_TARGET: "tidy-all"
    # If it is a Merge Request, run a diff scan against the target branch
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        TIDY_TARGET: "tidy-branch"
        BASE_BRANCH: "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    # If it is a normal feature branch, run a diff scan against main
    - if: $CI_COMMIT_BRANCH
      variables:
        TIDY_TARGET: "tidy-branch"
        BASE_BRANCH: "origin/$CI_DEFAULT_BRANCH"
  script:
    - cd build
    # GitLab does shallow clones and, to do a diff-based tidy, first fetch the base branch 
    - if [ "$TIDY_TARGET" = "tidy-branch" ]; then git fetch origin $CI_DEFAULT_BRANCH; fi
    - make $TIDY_TARGET BASE_BRANCH=$BASE_BRANCH
    - mv clang-tidy-report.txt ..
  artifacts:
    when: always
    paths:
      - clang-tidy-report.txt
    expire_in: 1 week

# ============================================================
# Release (triggered by date-format tags: YYYY-MM-DD)
# ============================================================

.release_shared_rules:
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d{4}-\d{2}-\d{2}$/

release:
  stage: release
  extends: .release_shared_rules
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: distcheck
      optional: false
  script: |
    ls -d -- build/*.tar.gz
    mv build/psrchive-${CI_COMMIT_TAG}.tar.gz .
    echo "***"
    echo "*** SHA-256 (256-bit) cryptographic checksum:"
    sha256sum psrchive-${CI_COMMIT_TAG}.tar.gz
    echo "***"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: "Source tarball"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/psrchive-${CI_COMMIT_TAG}.tar.gz"
  artifacts:
    paths:
      - psrchive-${CI_COMMIT_TAG}.tar.gz
    expire_in: 1 year

validate-tag-version:
  stage: .pre
  extends: .release_shared_rules
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script: |
    AC_VERSION=$(grep -A2 AC_INIT configure.ac | tail -1 | tr -d ' [],')
    if [ "${AC_VERSION}" != "${CI_COMMIT_TAG}" ]; then
      echo "=========================================================="
      echo "ERROR: configure.ac version does not match Git tag!"
      echo "Expected: ${CI_COMMIT_TAG}"
      echo "Found:    ${AC_VERSION}"
      echo "=========================================================="
      exit 1
    fi

