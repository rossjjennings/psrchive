# PSRCHIVE GitLab CI/CD Configuration
# Runs on gitlab.com shared runners

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH =~ /^adacs\//

stages:
  - sync
  - build
  - test

variables:
  GIT_SUBMODULE_STRATEGY: recursive

# Sync all SourceForge branches into GitLab (one-way, fast-forward only).
# Runs only on scheduled pipelines. New SourceForge branches are created
# on GitLab; existing branches are fast-forwarded. Branches that have
# diverged on GitLab (e.g. adacs/*) are skipped. Branches that only
# exist on GitLab are left untouched.
sync-sourceforge:
  stage: sync
  image: alpine:latest
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - apk add --no-cache git
    - git clone
        "https://oauth2:${GITLAB_PUSH_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git" repo
    - cd repo
    - git remote add sourceforge https://git.code.sf.net/p/psrchive/code
    - git fetch sourceforge
    - |
      for ref in $(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/sourceforge/); do
        [ "$ref" = "HEAD" ] && continue
        if git push origin "refs/remotes/sourceforge/${ref}:refs/heads/${ref}" 2>&1; then
          echo "Synced branch: $ref"
        else
          echo "Skipped branch (diverged or protected): $ref"
        fi
      done

# Use Ubuntu 22.04 LTS as base image
image: ubuntu:22.04

.install_dependencies: &install_dependencies
  - apt-get update -qq
  - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq
      autoconf
      automake
      libtool
      g++
      gfortran
      make
      pkg-config
      libfftw3-dev
      libgsl-dev
      libreadline-dev
      git

build:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  before_script:
    - *install_dependencies
  script:
    - ./bootstrap
    - ./configure --enable-lean
    - make -j$(nproc)
  artifacts:
    paths:
      - .
    expire_in: 1 hour

test:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  needs:
    - build
  before_script:
    - *install_dependencies
  script:
    - make check
  artifacts:
    when: always
    paths:
      - "*/test-suite.log"
      - "*/*/test-suite.log"
    expire_in: 1 week

# Full build with Python/SWIG bindings (not --enable-lean).
# Runs in parallel with the lean build+test jobs.
python-bindings:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  before_script:
    - *install_dependencies
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-dev python3-numpy swig
  script:
    - ./bootstrap
    - ./configure --prefix=/tmp/psrchive --enable-shared
    - make -j$(nproc)
    - make install
    - export LD_LIBRARY_PATH=/tmp/psrchive/lib
    - export PYTHONPATH=$(find /tmp/psrchive -name psrchive.py -printf '%h\n' | head -1)
    - python3 -c "import psrchive; print('Python bindings OK')"
