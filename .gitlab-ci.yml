# PSRCHIVE GitLab CI/CD Configuration

include:
  - project: 'pulsar-astronomy/build-commons'
    file: 'gitlab/builder.yml'

workflow:
  rules:
    # Prevent duplicate branch pipelines
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - !reference [.builder-rules]

stages:
  - prepare
  - build
  - test
  - analysis
  - release

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GITLAB_CI_TAG: k8srunner-psi-low

# ============================================================
# Shared-runner CI
# ============================================================

.shared_rules:
  rules:
    - when: on_success
  needs:
    - job: builder-image
      optional: true
    - job: validate-tag-version
      optional: true

# full build with all optional dependencies installed
.build-standard:
  stage: build
  extends: .shared_rules
  script: |
    ./bootstrap
    mkdir -p build
    cd build
    ../configure --enable-shared --prefix=/pulsar
    set -o pipefail
    # bear generates the compilation database used by clang-tidy
    # 'make check' also does 'make' - both are need for clang-tidy
    bear -- make -j4 check 2>&1 | tee make.log
    make install
    python -c "import ${CI_PROJECT_NAME}; print('Python bindings OK')"
  artifacts:
    when: always
    paths:
      - build/make.log
      - build/test-suite.log
      - build/compile_commands.json
    expire_in: 1 hour

# distcheck with all optional dependencies installed
distcheck:
  stage: test
  extends: .shared_rules
  script:
    - ./bootstrap
    - ./configure
    - set -o pipefail
    - make -j4 distcheck 2>&1 | tee distcheck.log
    - echo "TARBALL_NAME=$(ls *.tar.gz | head -n 1)" >> test.env
  artifacts:
    paths:
      - build/*.tar.gz
      - build/distcheck.log
    reports:
      # load variables from this file in subsequent jobs
      dotenv: build.env
    expire_in: 1 day

.cppcheck:
  stage: analysis
  extends: .shared_rules
  script:
    - cppcheck --enable=warning,performance,portability
        --suppress=missingIncludeSystem
        --xml --xml-version=2
        -I Util -I Base -I More
        Util Base More 2> cppcheck-report.xml
    - cppcheck --enable=warning,performance,portability
        --suppress=missingIncludeSystem
        Util Base More
  artifacts:
    when: always
    paths:
      - cppcheck-report.xml
    expire_in: 1 week

.clang-tidy:
  stage: analysis
  allow_failure: true # for now
  extends: .shared_rules
  needs:
    - job: build-standard
      optional: false
  rules:
    # If we are on the main/default branch, run a full scan
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        TIDY_TARGET: "tidy-all"
    # If it is a Merge Request, run a diff scan against the target branch
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        TIDY_TARGET: "tidy-branch"
        BASE_BRANCH: "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    # If it is a normal feature branch, run a diff scan against main
    - if: $CI_COMMIT_BRANCH
      variables:
        TIDY_TARGET: "tidy-branch"
        BASE_BRANCH: "origin/$CI_DEFAULT_BRANCH"
  script:
    - cd build
    # to do a diff-based tidy, first fetch the base branch 
    - if [ "$TIDY_TARGET" = "tidy-branch" ]; then git fetch origin $CI_DEFAULT_BRANCH; fi
    - make $TIDY_TARGET BASE_BRANCH=$BASE_BRANCH
    - mv clang-tidy-report.txt ..
  artifacts:
    when: always
    paths:
      - clang-tidy-report.txt
    expire_in: 1 week

# ============================================================
# Release (triggered by date-format tags: YYYY-MM-DD)
# ============================================================

.release_shared_rules:
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d{4}-\d{2}-\d{2}$/

release:
  stage: release
  extends: .release_shared_rules
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: distcheck
      optional: false
  before_script:
    - apk add --no-cache curl
  script:
    - |
      TARBALL=${CI_PROJECT_NAME}-${CI_COMMIT_TAG}.tar.gz
      echo "***"
      echo "*** SHA-256 (256-bit) cryptographic checksum:"
      sha256sum $TARBALL
      echo "***"
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file ${TARBALL} \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}/${CI_COMMIT_TAG}/${TARBALL}"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Release $CI_COMMIT_TAG'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_TAG'
    assets:
      links:
        - name: '${TARBALL}'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}/${CI_COMMIT_TAG}/${TARBALL}'
          filepath: '/${TARBALL}'

validate-tag-version:
  stage: .pre
  extends: .release_shared_rules
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script: |
    AC_VERSION=$(grep -A2 AC_INIT configure.ac | tail -1 | tr -d ' [],')
    if [ "${AC_VERSION}" != "${CI_COMMIT_TAG}" ]; then
      echo "=========================================================="
      echo "ERROR: configure.ac version does not match Git tag!"
      echo "Expected: ${CI_COMMIT_TAG}"
      echo "Found:    ${AC_VERSION}"
      echo "=========================================================="
      exit 1
    fi

