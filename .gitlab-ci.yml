# PSRCHIVE GitLab CI/CD Configuration

include:
  - project: 'pulsar-astronomy/build-commons'
    file: 'gitlab/builder.yml'

workflow:
  rules:
    - !reference [.builder-rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^adacs\//
    - if: $CI_COMMIT_TAG

stages:
  - prepare
  - build
  - test
  - analysis
  - release

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GITLAB_CI_TAG: k8srunner-psi-low

# ============================================================
# Shared-runner CI
# ============================================================

.shared_rules:
  rules:
    - when: on_success

# full build with all optional dependencies installed
full:
  stage: build
  extends: .shared_rules
  needs:
    - job: builder-image
      optional: true
  script:
    - source .build-commons/gitlab/init-local.sh
    - make -j$(nproc)
    - make install
    - python -c "import psrchive; print('Python bindings OK')"
  artifacts:
    paths:
      - .
    expire_in: 1 hour

# barebones build with no optional dependencies installed
barebones:
  stage: build
  extends: .shared_rules
  image: ubuntu:24.04
  before_script:
    - .build-commons/docker/install-deps.sh
  script:
    - ./bootstrap
    - ./configure --enable-shared
    - make -j$(nproc)
  artifacts:
    paths:
      - .
    expire_in: 1 hour

# full build and check with all optional dependencies installed
test:
  stage: test
  extends: .shared_rules
  needs:
    - job: build
      optional: true
  script:
    - source .build-commons/gitlab/init-local.sh
    - make -j$(nproc) check
  artifacts:
    when: always
    paths:
      - "*/test-suite.log"
      - "*/*/test-suite.log"
    expire_in: 1 week

# full build and distcheck with all optional dependencies installed
distcheck:
  stage: test
  extends: .shared_rules
  needs:
    - job: builder-image
      optional: true
  script:
    - source .build-commons/gitlab/init-local.sh
    - make distcheck
  artifacts:
    paths:
      - "*.tar.gz"
    expire_in: 1 day

cppcheck:
  stage: analysis
  extends: .shared_rules
  script:
    - cppcheck --enable=warning,performance,portability
        --suppress=missingIncludeSystem
        --xml --xml-version=2
        -I Util -I Base -I More
        Util Base More 2> cppcheck-report.xml
    - cppcheck --enable=warning,performance,portability
        --suppress=missingIncludeSystem
        Util Base More
  artifacts:
    when: always
    paths:
      - cppcheck-report.xml
    expire_in: 1 week

clang-tidy:
  stage: analysis
  extends: .shared_rules
  needs:
    - job: build
      optional: true
  script:
    - find Util Base More -name '*.C' -o -name '*.cc' -o -name '*.cpp'
        | head -50
        | xargs -r clang-tidy -p . --quiet 2>&1
        | tee clang-tidy-report.txt || true
  artifacts:
    when: always
    paths:
      - clang-tidy-report.txt
    expire_in: 1 week

# ============================================================
# Release (triggered by date-format tags: YYYY-MM-DD)
# ============================================================

.release_shared_rules:
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d{4}-\d{2}-\d{2}$/
    - when: never

release:
  stage: release
  extends: .release_shared_rules
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: distcheck
      optional: false
  script:
    - echo "***"
    - echo "*** SHA-256 (256-bit) cryptographic checksum:"
    - sha256sum psrchive-${CI_COMMIT_TAG}.tar.gz
    - echo "***"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: "Source tarball"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/psrchive-${CI_COMMIT_TAG}.tar.gz"
  artifacts:
    paths:
      - psrchive-${CI_COMMIT_TAG}.tar.gz
    expire_in: 1 year

