# PSRCHIVE GitLab CI/CD Configuration
#
# Two CI modes (mutually exclusive):
#   1. Shared-runner CI: $BUILDER_IMAGE on gitlab.com (when ENABLE_SKA_CI is unset)
#   2. SKA infrastructure CI: tagged runners (when ENABLE_SKA_CI is "true")
#
# Both modes run the same jobs. When one set runs, the other is skipped.
# All `needs` entries use `optional: true` so skipped jobs don't break
# the pipeline DAG validation.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^adacs\//
    - if: $CI_COMMIT_TAG

stages:
  - prepare
  - build
  - test
  - analysis
  - release

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GITLAB_CI_TAG: k8srunner-psi-low

include:
  - project: 'pulsar-astronomy/build-commons'
    file: 'gitlab/builder.yml'

# ============================================================
# Shared-runner CI (when ENABLE_SKA_CI is not set)
# ============================================================

.shared_rules:
  rules:
    - if: $ENABLE_SKA_CI == "true"
      when: never
    - when: on_success

build:
  stage: build
  extends: .shared_rules
  script:
    - source .build-commons/gitlab/init-local.sh
    - make -j$(nproc)
    - make install
  artifacts:
    paths:
      - .
    expire_in: 1 hour

test:
  stage: test
  extends: .shared_rules
  needs:
    - job: build
      optional: true
  script:
    - make check
  artifacts:
    when: always
    paths:
      - "*/test-suite.log"
      - "*/*/test-suite.log"
    expire_in: 1 week

distcheck:
  stage: test
  extends: .shared_rules
  needs:
    - job: build
      optional: true
  script:
    - make distcheck

python-bindings:
  stage: build
  extends: .shared_rules
  script:
    - source .build-commons/gitlab/init-local.sh
    - make -j$(nproc)
    - make install
    - python3 -c "import psrchive; print('Python bindings OK')"

cppcheck:
  stage: analysis
  extends: .shared_rules
  script:
    - cppcheck --enable=warning,performance,portability
        --suppress=missingIncludeSystem
        --xml --xml-version=2
        -I Util -I Base -I More
        Util Base More 2> cppcheck-report.xml
    - cppcheck --enable=warning,performance,portability
        --suppress=missingIncludeSystem
        Util Base More
  artifacts:
    when: always
    paths:
      - cppcheck-report.xml
    expire_in: 1 week

clang-tidy:
  stage: analysis
  extends: .shared_rules
  needs:
    - job: build
      optional: true
  script:
    - find Util Base More -name '*.C' -o -name '*.cc' -o -name '*.cpp'
        | head -50
        | xargs -r clang-tidy -p . --quiet 2>&1
        | tee clang-tidy-report.txt || true
  artifacts:
    when: always
    paths:
      - clang-tidy-report.txt
    expire_in: 1 week

# ============================================================
# SKA infrastructure CI (when ENABLE_SKA_CI is "true")
# ============================================================

.ska_rules:
  rules:
    - if: $ENABLE_SKA_CI != "true"
      when: never
    - when: on_success

build-ska:
  stage: build
  extends: .ska_rules
  image: $BUILDER_IMAGE
  tags:
    - $GITLAB_CI_TAG
  script:
    - source .build-commons/gitlab/init-local.sh
    - make -j$(nproc)
  artifacts:
    paths:
      - .
    expire_in: 1 hour

test-ska:
  stage: test
  extends: .ska_rules
  image: $BUILDER_IMAGE
  tags:
    - $GITLAB_CI_TAG
  needs:
    - job: build-ska
      optional: true
  script:
    - make check
  artifacts:
    when: always
    paths:
      - "*/test-suite.log"
      - "*/*/test-suite.log"
    expire_in: 1 week

python-bindings-ska:
  stage: build
  extends: .ska_rules
  image: $BUILDER_IMAGE
  tags:
    - $GITLAB_CI_TAG
  script:
    - source .build-commons/gitlab/init-local.sh
    - make -j$(nproc)
    - make install
    - python3 -c "import psrchive; print('Python bindings OK')"

cppcheck-ska:
  stage: analysis
  extends: .ska_rules
  image: $BUILDER_IMAGE
  tags:
    - $GITLAB_CI_TAG
  script:
    - cppcheck --enable=warning,performance,portability
        --suppress=missingIncludeSystem
        --xml --xml-version=2
        -I Util -I Base -I More
        Util Base More 2> cppcheck-report.xml
    - cppcheck --enable=warning,performance,portability
        --suppress=missingIncludeSystem
        Util Base More
  artifacts:
    when: always
    paths:
      - cppcheck-report.xml
    expire_in: 1 week

clang-tidy-ska:
  stage: analysis
  extends: .ska_rules
  image: $BUILDER_IMAGE
  tags:
    - $GITLAB_CI_TAG
  needs:
    - job: build-ska
      optional: true
  script:
    - find Util Base More -name '*.C' -o -name '*.cc' -o -name '*.cpp'
        | head -50
        | xargs -r clang-tidy -p . --quiet 2>&1
        | tee clang-tidy-report.txt || true
  artifacts:
    when: always
    paths:
      - clang-tidy-report.txt
    expire_in: 1 week

# ============================================================
# Release (triggered by date-format tags: YYYY-MM-DD)
# ============================================================

.release_shared_rules:
  rules:
    - if: $ENABLE_SKA_CI == "true"
      when: never
    - if: $CI_COMMIT_TAG =~ /^\d{4}-\d{2}-\d{2}$/
    - when: never

.release_ska_rules:
  rules:
    - if: $ENABLE_SKA_CI != "true"
      when: never
    - if: $CI_COMMIT_TAG =~ /^\d{4}-\d{2}-\d{2}$/
    - when: never

release:
  stage: release
  extends: .release_shared_rules
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: test
      optional: true
  before_script:
    - .build-commons/docker/install-deps.sh
  script:
    - ./bootstrap
    - ./configure --enable-shared
    - make dist
    - echo "***"
    - echo "*** SHA-256 (256-bit) cryptographic checksum:"
    - sha256sum psrchive-${CI_COMMIT_TAG}.tar.gz
    - echo "***"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: "Source tarball"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/psrchive-${CI_COMMIT_TAG}.tar.gz"
  artifacts:
    paths:
      - "*.tar.gz"
    expire_in: 1 year

